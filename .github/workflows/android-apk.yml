# Builds an installable debug APK on every push, so a change can go straight to a phone:
# open the run on GitHub, download "kanta-debug-apk", unzip, install.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the project's anon / publishable key
# Without them the APK still builds but shows "No backend configured" (app/build.gradle.kts).

name: Android APK

on:
  push:
    branches: [master, "claude/**"]
    paths-ignore:
      - "supabase/**"
      - "tools/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Accepts the SDK licences so AGP can fetch the compileSdk platform. The default package
      # list still names the removed "tools" package, so name only what exists.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # Says only whether each value exists — never the value itself. A value saved under the
      # Variables tab instead of Secrets is the usual mix-up, so that is reported too.
      - name: Check Supabase secrets
        run: |
          echo "::notice::Secrets — SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}, SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY != '' }}. Variables — SUPABASE_URL: ${{ vars.SUPABASE_URL != '' }}, SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY != '' }}."
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set — this APK will show 'No backend configured'."
          fi

      - name: Build debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: kanta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Unit tests
        shell: bash
        run: ./gradlew :app:testDebugUnitTest 2>&1 | tee test.log

      # Compiler errors and failing tests, collected at the very end of the log so they are easy
      # to find (and to read from the API, which serves the tail).
      - name: Summarise failures
        if: failure()
        shell: bash
        run: |
          grep -hE '^e: |^> Task .* FAILED|What went wrong' -A1 build.log 2>/dev/null | head -150 || true
          grep -hE ' FAILED$' -A3 test.log 2>/dev/null | head -150 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7
